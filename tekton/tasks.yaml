apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
      mountPath: /workspace/source
  steps:
    - name: clean
      image: alpine:3
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      env:
        - name: SOURCE_DIR
          value: "$(workspaces.source.path)"
      script: |
        #!/bin/sh
        set -eu
        test "$SOURCE_DIR" = "/workspace/source"
        test -d "$SOURCE_DIR"
        rm -rf -- "$SOURCE_DIR"/* \
          "$SOURCE_DIR"/.[!.]* \
          "$SOURCE_DIR"/..?*
        echo "Pipeline workspace cleared."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: python:3.9-slim
      workingDir: "$(workspaces.source.path)"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      env:
        - name: DATABASE_URI
          value: "sqlite:////tmp/accounts-test.db"
      script: |
        #!/bin/sh
        set -eu
        python -m venv /tmp/nose-venv
        /tmp/nose-venv/bin/python -m pip install --no-cache-dir -r requirements.txt
        /tmp/nose-venv/bin/nosetests
