apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  params:
    - name: repo-url
      type: string
    - name: branch
      type: string
      default: main
    - name: build-image
      type: string
  workspaces:
    - name: pipeline-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
      params:
        - name: url
          value: "$(params.repo-url)"
        - name: revision
          value: "$(params.branch)"
      workspaces:
        - name: output
          workspace: pipeline-workspace

    - name: lint
      runAfter:
        - clone
      taskRef:
        name: flake8
      params:
        - name: path
          value: service
        - name: requirements_file
          value: ""
        - name: args
          value:
            - "--count"
            - "--max-complexity=10"
            - "--max-line-length=127"
            - "--statistics"
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: tests
      runAfter:
        - clone
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: build
      runAfter:
        - lint
        - tests
      taskRef:
        name: buildah
        kind: ClusterTask
      params:
        - name: IMAGE
          value: "$(params.build-image)"
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: deploy
      runAfter:
        - build
      taskRef:
        name: openshift-client
        kind: ClusterTask
      params:
        - name: SCRIPT
          value: |
            set -eu
            sed 's|IMAGE_NAME_HERE|$(params.build-image)@$(tasks.build.results.IMAGE_DIGEST)|g' \
              deploy/deployment.yaml > /tmp/accounts-deployment.yaml
            oc apply -f /tmp/accounts-deployment.yaml
            oc apply -f deploy/service.yaml
            oc rollout status deployment/accounts --timeout=180s
            oc get pods -l app=accounts
      workspaces:
        - name: manifest-dir
          workspace: pipeline-workspace
